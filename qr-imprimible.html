<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>QR del álbum · L&amp;C</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ddd;
      font-family: Montserrat, sans-serif;
      color: #3F3A36;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      background: #fff;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 9mm 8mm;
      background: radial-gradient(ellipse at 50% 30%, #FBF8F2 0%, #F4EDE2 60%, #EDE3D3 100%);
      border: 0.2mm dashed #cbbfae;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 4.5mm;
      border: 0.35mm solid #C8A15E;
      border-radius: 3mm;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 6mm;
      border: 0.15mm solid rgba(200, 161, 94, .55);
      border-radius: 2.4mm;
      pointer-events: none;
    }

    .logo { width: 32mm; }

    .date { margin: 2.5mm 0 0; font-size: 2.6mm; letter-spacing: 1.6mm; color: #6E625A; }

    .ornament { display: flex; align-items: center; gap: 2.5mm; margin: 3.5mm 0 3mm; }
    .ornament i { width: 14mm; height: 0.25mm; background: linear-gradient(90deg, transparent, #C8A15E); }
    .ornament i:last-child { transform: scaleX(-1); }
    .ornament b { width: 1.8mm; height: 1.8mm; border: 0.25mm solid #C8A15E; transform: rotate(45deg); }

    h2 { margin: 0; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 9mm; }

    .text { margin: 1.5mm 0 4mm; max-width: 72mm; text-align: center; font-size: 2.9mm; line-height: 1.45; color: #6E625A; }

    .qr {
      padding: 2.2mm;
      background: #fff;
      border: 0.4mm solid #C8A15E;
      border-radius: 2.5mm;
      box-shadow: 0 1mm 3mm rgba(80, 60, 40, .15);
    }

    .qr svg { display: block; width: 40mm; height: 40mm; }

    .foot { margin: 3.5mm 0 0; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 4.2mm; color: #9E5539; }

    @media print { body { background: none; } }
  </style>
</head>
<body>
  <div class="sheet" id="sheet"></div>
  <script src="qrcode.js"></script>
  <script>
    const url = new URLSearchParams(location.search).get('url') || 'https://example.com';
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    const svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    const card = `
      <div class="card">
        <img class="logo" src="logo.png" alt="L&amp;C">
        <p class="date">13 · 11 · 2026</p>
        <div class="ornament"><i></i><b></b><i></i></div>
        <h2>Nuestras fotos</h2>
        <p class="text">Escaneá el código para ver y descargar todas las fotos de la cabina</p>
        <div class="qr">${svg}</div>
        <p class="foot">Gracias por acompañarnos</p>
      </div>`;
    document.getElementById('sheet').innerHTML = card.repeat(4);
  </script>
</body>
</html>
